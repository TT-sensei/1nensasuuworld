<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>算数ワールド｜ぼうけんマップ</title>
<style>
:root{--ink:#263238;--muted:#607d8b;--card:#fff;--accent:#1565c0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);background:linear-gradient(160deg,#e3f2fd,#fff8e1 55%,#e8f5e9);padding:14px}
main{max-width:760px;margin:auto}.hero{padding:8px 4px 14px;text-align:center}.hero h1{margin:0;color:#0d47a1;font-size:clamp(1.7rem,5vw,2.5rem)}.hero p{margin:6px 0 0;color:var(--muted);font-weight:700}
.panel{background:rgba(255,255,255,.94);border:2px solid #d7e3ea;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 5px 0 rgba(38,50,56,.10)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:10px 6px;background:#f5f9fb;border-radius:13px;text-align:center}.stat strong{display:block;font-size:1.25rem;color:#1565c0}.stat small{color:var(--muted)}
.progress{height:13px;background:#e6eef2;border-radius:99px;overflow:hidden;margin:12px 0 5px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#42a5f5,#66bb6a);border-radius:inherit}
.next{display:flex;align-items:center;justify-content:space-between;gap:12px}.next h2{font-size:1.05rem;margin:0 0 4px}.next p{margin:0;color:var(--muted);font-size:.88rem}.primary,.build,.reset{border:0;border-radius:12px;padding:12px 15px;font-weight:800;font-size:1rem;cursor:pointer}.primary{background:#1565c0;color:white;box-shadow:0 4px 0 #0d47a1}.build{background:#ffb300;color:#402800;box-shadow:0 4px 0 #f57c00;width:100%;margin-top:12px}.reset{background:#eceff1;color:#455a64;margin-top:10px;font-size:.8rem}.primary:disabled,.build:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.map-title{margin:18px 4px 9px;font-size:1.2rem}.world-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.world-node{display:block;text-decoration:none;color:var(--ink);background:var(--card);border-radius:17px;padding:15px 10px;border:3px solid var(--c);box-shadow:0 5px 0 var(--s);text-align:center;min-height:126px}.world-node:active{transform:translateY(4px);box-shadow:0 1px 0 var(--s)}.world-icon{font-size:2.25rem}.world-name{font-weight:800;margin-top:5px}.world-desc{font-size:.78rem;color:var(--muted);margin-top:3px}.sub-menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.sub-menu a{text-align:center;padding:13px;border-radius:13px;background:#fff;text-decoration:none;color:#37474f;font-weight:800;border:2px solid #d7e3ea}.mastery-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mastery-item{background:#f7fafb;border-radius:12px;padding:9px}.mastery-label{display:flex;justify-content:space-between;font-size:.82rem;font-weight:800}.mini-progress{height:8px;background:#e0e8ec;border-radius:9px;overflow:hidden;margin-top:6px}.mini-progress i{display:block;height:100%;background:#66bb6a}
@media(min-width:600px){body{padding:24px}.world-grid{grid-template-columns:repeat(3,1fr)}.next{padding:2px 8px}}
</style>
</head>
<body data-home="true">
<main>
<header class="hero"><h1>🌈 算数ワールド</h1><p>たのしく学んで、ぼうけんの街を育てよう！</p></header>
<section class="panel">
<div class="stats"><div class="stat"><strong id="ui-level">1</strong><small>レベル</small></div><div class="stat"><strong id="ui-energy">0</strong><small>エネルギー</small></div><div class="stat"><strong id="ui-streak">0</strong><small>れんぞく正解</small></div></div>
<div class="progress"><i id="ui-exp-bar"></i></div><div id="ui-exp-text" style="text-align:right;color:#607d8b;font-size:.8rem"></div>
</section>
<section class="panel"><div class="next"><div><h2 id="ui-next-title">きょうのぼうけん</h2><p id="ui-next-text">好きなステージを選んで、問題に挑戦しよう。</p></div><a id="continue-link" class="primary" href="unit1.html">はじめる</a></div></section>
<section class="panel"><h2 style="margin:0 0 10px;font-size:1.05rem">📚 学びの進みぐあい</h2><div id="mastery-grid" class="mastery-grid"></div></section>
<section class="panel"><div class="next"><div><h2>🏙️ ぼうけんの街</h2><p><span id="ui-city-name">何もない荒地</span>（Lv.<span id="ui-city-level">0</span>）</p></div><div style="font-size:3rem" id="ui-city-emoji">🏕️</div></div><button class="build" id="ui-btn-build">🔨 建設する</button><button class="reset" onclick="resetData()">記録をリセット</button></section>
<h2 class="map-title">🗺️ ぼうけんマップ</h2>
<div class="world-grid">
<a class="world-node" style="--c:#8bc34a;--s:#689f38" href="unit1.html"><div class="world-icon">🔰</div><div class="world-name">はじまりの村</div><div class="world-desc">1〜10の かず</div></a>
<a class="world-node" style="--c:#ffca28;--s:#ff8f00" href="unit2.html"><div class="world-icon">🏛️</div><div class="world-name">10の神殿</div><div class="world-desc">10を つくる</div></a>
<a class="world-node" style="--c:#4caf50;--s:#2e7d32" href="unit3.html"><div class="world-icon">🌳</div><div class="world-name">なかまの森</div><div class="world-desc">かずの ぶんかい</div></a>
<a class="world-node" style="--c:#f44336;--s:#c62828" href="unit4.html"><div class="world-icon">🌋</div><div class="world-name">たし算火山</div><div class="world-desc">たし算に ちょうせん</div></a>
<a class="world-node" style="--c:#9c27b0;--s:#6a1b9a" href="unit5.html"><div class="world-icon">🦇</div><div class="world-name">ひき算どうくつ</div><div class="world-desc">ひき算の 試練</div></a>
<a class="world-node" style="--c:#03a9f4;--s:#0277bd" href="unit6.html"><div class="world-icon">💬</div><div class="world-name">ことばの町</div><div class="world-desc">文章もんだい</div></a>
</div>
<div class="sub-menu"><a href="gacha.html">✨ 仲間ガチャ</a><a href="book.html">📖 なかま図鑑</a></div>
</main>
<script src="system.js"></script>
<script>
const CITY_EMOJIS=["🏕️","🗿","⛺","⛲","🛖","🌱","🛠️","🧱","🎪","🕰️","🍞","📚","🔭","🗽","🏰"];
function updateUI(){
 const data=loadData(), next=data.level*100, current=(data.level-1)*100, inLevel=data.exp;
 document.getElementById("ui-level").textContent=data.level;
 document.getElementById("ui-energy").textContent=data.energy;
 document.getElementById("ui-streak").textContent=data.streak;
 document.getElementById("ui-exp-bar").style.width=Math.min(100,(inLevel/next)*100)+"%";
 document.getElementById("ui-exp-text").textContent="つぎのレベルまで "+Math.max(0,next-inLevel)+" EXP";
 const city=data.cityLevel, mastery=getTotalMastery(data);
 document.getElementById("ui-city-level").textContent=city;
 document.getElementById("ui-city-name").textContent=city?CITY_BUILDINGS[city-1].name:"何もない荒地";
 document.getElementById("ui-city-emoji").textContent=CITY_EMOJIS[Math.min(city,CITY_EMOJIS.length-1)];
 const labels=["1〜10の かず","10を つくる","かずの ぶんかい","たし算","ひき算","文章もんだい"]; document.getElementById("mastery-grid").innerHTML=labels.map((label,i)=>{const p=data.unitProgress["unit"+(i+1)]||{mastery:0};return `<div class="mastery-item"><div class="mastery-label"><span>${label}</span><span>${p.mastery}%</span></div><div class="mini-progress"><i style="width:${p.mastery}%"></i></div></div>`}).join("");
 const nextBuilding=CITY_BUILDINGS[city], btn=document.getElementById("ui-btn-build");
 if(nextBuilding){document.getElementById("ui-next-text").textContent="つぎは「"+nextBuilding.name+"」をめざそう！";btn.textContent=data.level>=nextBuilding.requiredLevel&&data.energy>=nextBuilding.cost&&mastery>=nextBuilding.requiredMastery?"🔨 建設する！":"🔒 Lv."+nextBuilding.requiredLevel+"・⚡"+nextBuilding.cost+"・学び"+nextBuilding.requiredMastery+"%";btn.disabled=!(data.level>=nextBuilding.requiredLevel&&data.energy>=nextBuilding.cost&&mastery>=nextBuilding.requiredMastery)}else{btn.textContent="👑 街が完成！";btn.disabled=true}
 document.getElementById("continue-link").textContent=data.lastPlayed?"つづきから":"はじめる";
}
document.getElementById("ui-btn-build").onclick=()=>{if(buildCity())updateUI()};
window.addEventListener("pageshow",updateUI);updateUI();
</script>
</body>
</html>
