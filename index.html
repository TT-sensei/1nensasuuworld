<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>算数ワールド｜バッヂコレクション</title><style>.navi-strip{display:flex;justify-content:center;align-items:end;gap:clamp(4px,2vw,14px);min-height:64px;margin:4px auto 12px;padding:4px 10px;pointer-events:none}.navi-strip img{width:clamp(42px,8vw,62px);height:clamp(42px,8vw,62px);object-fit:contain;filter:drop-shadow(0 2px 2px #26323822)}.navi-strip img:nth-child(even){transform:translateY(-5px)}@media(max-width:480px){.navi-strip{margin-bottom:8px;gap:2px}.navi-strip img{width:42px;height:42px}}
*{box-sizing:border-box}body{margin:0;padding:16px;font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif;color:#263238;background:linear-gradient(145deg,#e3f2fd,#fff8e1 55%,#f3e5f5)}main{max-width:780px;margin:auto}.hero{text-align:center}.hero h1{color:#0d47a1;margin:4px 0;font-size:clamp(1.8rem,5vw,2.5rem)}.hero p{color:#607d8b;font-weight:800}.panel{background:#fffffff2;border:2px solid #d7e3ea;border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 5px #26323818}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#f5f9fb;border-radius:13px;padding:10px 4px}.stat strong{display:block;color:#1565c0;font-size:1.3rem}.progress{height:11px;background:#e6eef2;border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#42a5f5,#66bb6a)}h2{font-size:1.1rem}.stages{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stage{padding:14px 8px;border:3px solid var(--c);border-radius:16px;box-shadow:0 4px var(--s);text-decoration:none;color:#263238;text-align:center;background:#fff}.stage b{display:block;margin-top:4px}.stage small{color:#607d8b}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{color:#fff;text-decoration:none;text-align:center;padding:18px 8px;border-radius:16px;font-weight:900;box-shadow:0 5px #0003}.gacha{background:#6a1b9a}.book{background:#ef6c00}.reset{border:0;border-radius:10px;padding:10px;font-weight:800;color:#455a64}@media(min-width:600px){.stages{grid-template-columns:repeat(3,1fr)}}
</style></head><body data-home="true"><main><header class="hero"><h1>🌈 算数ワールド</h1><p>もんだいを といて、バッヂを あつめよう！</p></header><div class="navi-strip" aria-hidden="true"><img src="https://tt-sensei.github.io/navi-character-/assets/web/characters/riku/expressions/01-normal-smile.webp"><img src="https://tt-sensei.github.io/navi-character-/assets/web/characters/sora/expressions/02-happy.webp"><img src="https://tt-sensei.github.io/navi-character-/assets/web/characters/kai/expressions/04-idea.webp"><img src="https://tt-sensei.github.io/navi-character-/assets/web/characters/saku/expressions/01-normal-smile.webp"><img src="https://tt-sensei.github.io/navi-character-/assets/web/characters/tsuki/expressions/08-celebrating.webp"><img src="https://tt-sensei.github.io/navi-character-/assets/web/characters/nami/expressions/03-thinking.webp"></div><section class="panel"><div class="stats"><div class="stat"><strong id="lv">1</strong><small>レベル</small></div><div class="stat"><strong id="energy">0</strong><small>ガチャエネルギー</small></div><div class="stat"><strong id="badges">0</strong><small>バッヂ</small></div></div><div class="progress"><i id="xp"></i></div><p id="xptext" style="text-align:right;color:#607d8b;font-size:.8rem"></p></section><section class="panel"><h2>📚 もんだいに ちょうせん</h2><div class="stages"><a class="stage" style="--c:#8bc34a;--s:#689f38" href="unit1.html">🔢<b>はじまりの村</b><small>1〜10の かず</small></a><a class="stage" style="--c:#ffca28;--s:#ff8f00" href="unit2.html">🔟<b>10の神殿</b><small>10を つくる</small></a><a class="stage" style="--c:#4caf50;--s:#2e7d32" href="unit3.html">🌳<b>なかまの森</b><small>かずの ぶんかい</small></a><a class="stage" style="--c:#f44336;--s:#c62828" href="unit4.html">➕<b>たし算火山</b><small>たし算</small></a><a class="stage" style="--c:#9c27b0;--s:#6a1b9a" href="unit5.html">➖<b>ひき算どうくつ</b><small>ひき算</small></a><a class="stage" style="--c:#03a9f4;--s:#0277bd" href="unit6.html">💬<b>ことばの町</b><small>文章もんだい</small></a></div></section><section class="panel"><div class="actions"><a class="action gacha" href="gacha.html">✨<br>バッヂガチャ</a><a class="action book" href="book.html">📖<br>コレクション</a></div></section><section class="panel"><h2>📈 学びの進みぐあい</h2><div id="mastery" class="stages"></div><button class="reset" onclick="resetData()">記録をリセット</button></section></main><script src="sound.js"></script><script src="system.js"></script><script>function update(){let d=loadData(),need=d.level*100;lv.textContent=d.level;energy.textContent=d.energy;badges.textContent=d.companions.reduce((s,x)=>s+(x.count||1),0);xp.style.width=Math.min(100,d.exp/need*100)+'%';xptext.textContent='つぎのレベルまで '+Math.max(0,need-d.exp)+' EXP';let labels=['1〜10の かず','10を つくる','かずの ぶんかい','たし算','ひき算','文章もんだい'];mastery.innerHTML=labels.map((x,i)=>{let p=d.unitProgress['unit'+(i+1)]||{};return `<div class="stage" style="--c:#90a4ae;--s:#607d8b"><b>${x}</b><small>${p.mastery||0}%</small></div>`}).join('')}update();addEventListener('pageshow',update)</script></body></html>
