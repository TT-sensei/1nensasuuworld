<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バッヂガチャ</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif;color:#263238;background:radial-gradient(circle at top,#ede7f6,#fff8e1 65%,#e3f2fd)}main{max-width:720px;margin:auto}.hero{text-align:center}.hero h1{color:#5e35b1}.sub{color:#6a1b9a;font-weight:800}.panel{background:#fffffff2;border:2px solid #d7e3ea;border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 5px #26323818;text-align:center}.energy{display:inline-block;background:#fff3e0;border:2px solid #ffb300;border-radius:99px;padding:10px 22px;font-size:1.3rem;font-weight:900}.machine{font-size:5rem;filter:drop-shadow(0 0 12px #ffd54f);margin:16px}.shake{animation:shake .3s infinite}.draw{border:0;border-radius:14px;padding:14px 20px;background:#6a1b9a;color:#fff;font-weight:900;font-size:1.1rem;box-shadow:0 5px #4527a0}.draw:disabled{background:#b0bec5;box-shadow:none}.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:14px}.rates div{padding:8px 2px;background:#f7fafb;border-radius:9px;font-size:.7rem;font-weight:900}.result{display:none}.result.show{display:block;animation:pop .4s}.result img{width:min(55vw,220px);height:min(55vw,220px);object-fit:contain}.rare{font-weight:900;font-size:1.2rem}.common{color:#607d8b}.rare{color:#1976d2}.super-rare{color:#8e24aa}.secret{color:#e65100}.back{display:block;text-align:center;color:#455a64;font-weight:800;margin:16px}@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}</style></head><body><main><header class="hero"><h1>✨ バッヂガチャ</h1><div class="sub">もんだいを とくと、ガチャエネルギーが たまるよ！</div></header><section class="panel"><div class="energy">⚡ <span id="energy">0</span></div><div id="machine" class="machine">🎁</div><button id="draw" class="draw">1回まわす（⚡30）</button><div class="rates"><div>COMMON<br>70%</div><div>RARE<br>20%</div><div>SUPER RARE<br>8%</div><div>SECRET<br>2%</div></div><p style="color:#607d8b;font-size:.8rem">景品は edu-assets のコレクションバッヂ。重複すると所持数がふえます。</p></section><section id="result" class="panel result"><div>＼ バッヂを ゲット！ ／</div><img id="image"><h2 id="name"></h2><div id="rarity" class="rare"></div></section><a class="back" href="book.html">📖 コレクションを見る</a><a class="back" href="index.html">⬅️ ホーム</a></main><script src="sound.js"></script><script src="system.js"></script><script>
const A='https://tt-sensei.github.io/edu-assets/assets/collections/',S={animal:['bear','cat','fox','hamster','panda','penguin','rabbit','shiba','hedgehog','koala','otter','squirrel','lion','white-tiger','unicorn-puppy'],flower:['cherry-blossom','clover-flower','daisy','dandelion','hydrangea','morning-glory','sunflower','tulip','camellia','lavender','lily','rose','blue-rose','lotus','rainbow-flower'],gem:['amethyst','aquamarine','citrine','emerald','garnet','ruby','sapphire','topaz','moonstone','opal','peridot','tourmaline','black-opal','diamond','prism-crystal'],space:['01-earth.png','02-moon.png','03-mars.png','04-saturn.png','05-rocket.png','06-ufo.png','07-star.png','08-astronaut-helmet.png','09-comet.png','10-galaxy.png','11-space-station.png','12-nebula-planet.png','13-black-hole.png','14-supernova-star.png','15-cosmic-gate.png'],treasure:['coin-pouch','compass','gem-shard','gold-coin','golden-lock','royal-goblet','silver-key','treasure-ring','ancient-relic','jeweled-dagger','royal-crown','treasure-chest','crystal-crown','golden-idol','celestial-treasure-core']},R=['common','rare','super-rare','secret'];
function getRarity(){let x=Math.random()*100;return x<70?'common':x<90?'rare':x<98?'super-rare':'secret'}function pick(){let r=getRarity(),s=Object.keys(S)[Math.floor(Math.random()*5)],range=r==='common'?[0,8]:r==='rare'?[8,12]:r==='super-rare'?[12,14]:[14,15],id=S[s][range[0]+Math.floor(Math.random()*(range[1]-range[0]))];return{id,series:s,rarity:r,image:s==='space'?`${A}${s}/${r}/${id}`:`${A}${s}/${r}/${id}/badge.png`,name:id.replaceAll('-',' ')}}
function update(){let d=loadData();energy.textContent=d.energy;draw.disabled=d.energy<30;draw.textContent=d.energy<30?'⚡ エネルギーが たりないよ':'1回まわす（⚡30）'}draw.onclick=()=>{let d=loadData();if(d.energy<30)return;d.energy-=30;let x=pick(),old=d.companions.find(v=>v.id===x.id);old?old.count=(old.count||1)+1:d.companions.push({...x,count:1});saveData(d);machine.classList.add('shake');result.classList.remove('show');draw.disabled=true;setTimeout(()=>{machine.classList.remove('shake');image.src=x.image;name.textContent=`${x.series}｜${x.name}`;document.getElementById('rarity').textContent=x.rarity.toUpperCase();document.getElementById('rarity').className='rare '+x.rarity;result.classList.add('show');update();playSound(x.rarity==='secret'||x.rarity==='super-rare'?'clear':'correct')},800)};update();</script></body></html>
