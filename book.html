<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バッヂコレクション</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif;background:linear-gradient(160deg,#fff8e1,#f3e5f5,#e3f2fd);color:#263238}main{max-width:820px;margin:auto}.hero{text-align:center}.hero h1{color:#5d4037}.panel{background:#fffffff2;border:2px solid #d7e3ea;border-radius:20px;padding:14px;margin:14px 0;box-shadow:0 5px #26323818}.summary{text-align:center;font-weight:900}.summary strong{color:#e65100;font-size:1.4rem}.filters{display:flex;gap:6px;overflow:auto;margin-top:12px}.filter{white-space:nowrap;border:2px solid #d7ccc8;background:#fff;border-radius:99px;padding:8px 12px;font-weight:800}.filter.active{background:#8d6e63;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{position:relative;background:#fff;border:2px solid #eee;border-radius:14px;padding:7px 4px;text-align:center;min-height:135px;box-shadow:0 4px #d7ccc8}.card img{width:100%;height:82px;object-fit:contain}.card b{display:block;font-size:.68rem}.card small{color:#607d8b;font-size:.62rem}.locked{filter:grayscale(1);opacity:.42;background:#eceff1}.locked img{filter:brightness(0)}.count{position:absolute;right:3px;top:3px;background:#ff9800;color:#fff;border-radius:99px;padding:3px 6px;font-size:.7rem;font-weight:900}.back{display:block;text-align:center;color:#455a64;font-weight:800;margin:16px}@media(min-width:600px){.grid{grid-template-columns:repeat(5,1fr)}}</style></head><body><main><header class="hero"><h1>📖 バッヂコレクション</h1><p>あつめたバッヂを かくにんしよう！</p></header><section class="panel"><div class="summary">集めた種類 <strong id="unique">0</strong> / <span id="total">0</span>　所持数 <strong id="owned">0</strong></div><div id="filters" class="filters"></div></section><section class="panel"><div id="grid" class="grid"></div></section><a class="back" href="gacha.html">✨ バッヂガチャへ</a><a class="back" href="index.html">⬅️ ホーム</a></main><script src="system.js"></script><script>
const A='https://tt-sensei.github.io/edu-assets/assets/collections/',N={animal:['bear','cat','fox','hamster','panda','penguin','rabbit','shiba','hedgehog','koala','otter','squirrel','lion','white-tiger','unicorn-puppy'],flower:['cherry-blossom','clover-flower','daisy','dandelion','hydrangea','morning-glory','sunflower','tulip','camellia','lavender','lily','rose','blue-rose','lotus','rainbow-flower'],gem:['amethyst','aquamarine','citrine','emerald','garnet','ruby','sapphire','topaz','moonstone','opal','peridot','tourmaline','black-opal','diamond','prism-crystal'],space:['01-earth.png','02-moon.png','03-mars.png','04-saturn.png','05-rocket.png','06-ufo.png','07-star.png','08-astronaut-helmet.png','09-comet.png','10-galaxy.png','11-space-station.png','12-nebula-planet.png','13-black-hole.png','14-supernova-star.png','15-cosmic-gate.png'],treasure:['coin-pouch','compass','gem-shard','gold-coin','golden-lock','royal-goblet','silver-key','treasure-ring','ancient-relic','jeweled-dagger','royal-crown','treasure-chest','crystal-crown','golden-idol','celestial-treasure-core']},R=['common','rare','super-rare','secret'];let selected='all',all=[];Object.entries(N).forEach(([s,ids])=>ids.forEach((id,i)=>{let r=i<8?'common':i<12?'rare':i<14?'super-rare':'secret';all.push({id,series:s,rarity:r,image:`${A}${s}/${r}/${id}/badge.png`})}));function render(){let d=loadData(),got=d.companions,shown=all.filter(x=>selected==='all'||x.series===selected);unique.textContent=got.filter(x=>x.count>0).length;owned.textContent=got.reduce((s,x)=>s+(x.count||1),0);total.textContent=all.length;grid.innerHTML=shown.map(x=>{let g=got.find(y=>y.id===x.id),has=!!g;return `<div class="card ${has?'':'locked'}"><img src="${x.image}"><b>${has?x.name:'？？？'}</b><small>${x.series}｜${x.rarity.toUpperCase()}</small>${has?`<span class="count">×${g.count||1}</span>`:''}</div>`}).join('')}filters.innerHTML=`<button class="filter active" data-s="all">すべて</button>`+Object.keys(N).map(x=>`<button class="filter" data-s="${x}">${x}</button>`).join('');filters.onclick=e=>{let b=e.target.closest('button');if(!b)return;selected=b.dataset.s;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()};render();</script></body></html>
